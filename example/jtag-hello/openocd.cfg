# Run the Verilator Vjtag_tb server first (default loopback TCP port 9824).
# Override with: openocd -c 'set RBB_PORT 12345' -f <this-file>
if {![info exists RBB_PORT]} { set RBB_PORT 9824 }
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port $RBB_PORT
transport select jtag
reset_config none
jtag newtap edge cpu -irlen 5 -expected-id 0x00000ffd
target create edge.cpu riscv -chain-position edge.cpu
source [file join [file dirname [info script]] jtag_helpers.tcl]
init
halt
riscv set_mem_access sysbus
# This NPU address space is physical; no MMU/CSR translation probe.
riscv set_enable_virt2phys off
