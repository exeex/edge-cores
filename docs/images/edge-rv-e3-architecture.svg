<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1058" role="img" aria-labelledby="title desc">
  <title id="title">edge-rv@e3 architecture</title>
  <desc id="desc">The edge-rv scalar control plane integrated with the edge-e3 tensor ASIC, DMA, accelerator units, and shared DTCM.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101217"/>
      <stop offset="1" stop-color="#1d222b"/>
    </linearGradient>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #435d78; font-size: 40px; font-weight: 400; text-anchor: middle; }
      .light-label { fill: #fff; font-size: 40px; font-weight: 400; text-anchor: middle; }
      .dark-label { fill: #05070a; font-size: 40px; font-weight: 500; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1340" height="1058" fill="url(#background)"/>

  <!-- edge-e3 ASIC boundary, notched around the edge-rv control plane -->
  <path d="M 674 98 H 1300 V 940 H 40 V 460 H 674 Z" fill="none" stroke="#ff3973" stroke-width="9" stroke-linejoin="round"/>

  <!-- edge-rv control plane -->
  <rect x="44" y="100" width="620" height="356" rx="3" fill="#12151b" stroke="#25ff2a" stroke-width="9"/>
  <text x="350" y="59" fill="#25ff2a" font-size="52" text-anchor="middle">edge-rv</text>

  <rect x="68" y="132" width="572" height="68" fill="#f7f7f7"/>
  <text class="label" x="354" y="180">AXI interface 128b</text>

  <rect x="65" y="230" width="311" height="95" fill="#a8b6c9"/>
  <text class="light-label" x="220" y="290">I cache 16 KB</text>

  <rect x="65" y="351" width="311" height="91" fill="#a8b6c9"/>
  <text class="light-label" x="220" y="411">D cache 16 KB</text>

  <rect x="400" y="227" width="254" height="215" fill="#7debdc"/>
  <text class="label" x="527" y="324">scalar unit</text>
  <text class="label" x="527" y="379">rv64imf_zba</text>

  <!-- edge-e3 compute and memory blocks -->
  <rect x="62" y="472" width="311" height="185" fill="#ffff86"/>
  <text class="dark-label" x="217" y="579">ACTU</text>

  <rect x="400" y="472" width="257" height="185" fill="#ffff86"/>
  <text class="dark-label" x="528" y="579">CMPU</text>

  <rect x="683" y="132" width="136" height="525" fill="#788da6"/>
  <text class="light-label" x="751" y="409">DMA</text>

  <rect x="846" y="132" width="408" height="525" fill="#f1a6b6"/>
  <text class="label" x="1050" y="354">tensor 8x8</text>
  <text class="label" x="1050" y="409">bf16 x bf16</text>
  <text class="label" x="1050" y="464">bf16 x i8</text>

  <rect x="65" y="685" width="1189" height="218" fill="#a8b6c9"/>
  <text class="light-label" x="660" y="807">128 KB SRAM (DTCM)</text>

  <text x="1110" y="1027" fill="#ff3973" font-size="52" text-anchor="middle">edge-e3 ASIC</text>
</svg>
